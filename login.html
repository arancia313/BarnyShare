<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - BarnyShare</title>
  <style>
    body { font-family: system-ui, -apple-system,Segoe UI, Roboto, "Helvetica Neue", Arial; padding: 2rem; background:#f7f7f8; }
    .card{max-width:420px;margin:2rem auto;padding:1.5rem;background:white;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    label{display:block;margin:.5rem 0 0.25rem;font-weight:600}
    input{width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px}
    button{margin-top:1rem;padding:.6rem 1rem;border:none;background:#007acc;color:white;border-radius:6px;cursor:pointer}
    .muted{color:#666;font-size:.9rem}
    .error{color:#b00020;margin-top:.5rem}
  </style>
</head>
<body>
  <main class="card">
    <h2>Accedi</h2>
    <p class="muted">Insert your BarnyShare Login info here.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="tuo@esempio.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required />

      <button type="submit">Login</button>
    </form>

    <div id="message" aria-live="polite"></div>

    <p class="muted">Don't have an account? <a href="/signup.html">Sign up!</a></p>
  </main>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          msg.textContent = 'Inserisci email e password';
          msg.className = 'error';
          return;
        }

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.textContent = data && data.error ? data.error : 'Credenziali non valide';
            msg.className = 'error';
            return;
          }

          // Login successful — server sets HttpOnly cookie; redirect to home
          window.location.href = '/';
        } catch (err) {
          msg.textContent = 'Impossibile contattare il server';
          msg.className = 'error';
          console.error(err);
        }
      });
    })();
  </script>
</body>
</html>
