<body>
  <main class="card">
    <h2>Registrati</h2>
    <p class="muted">Create an account on BarnyShare!</p>

    <form id="signupForm">
      <label for="displayName">Public Name</label>
      <input id="displayName" name="displayName" placeholder="Es. anonyorange" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Almeno 6 caratteri" required minlength="6" />

      <button type="submit">Sign up</button>
    </form>

    <div id="message" aria-live="polite"></div>

    <p class="muted">Already have an account? <a href="/login.html">Log in.</a></p>
  </main>
    <footer>
        <ul style="display:top;gap:8px;align-items:center;margin:0;padding:0;">
            <li><a id="IconImage" href="https://arancia313.github.io/BarnyShare"><img src="https://arancia313.github.io/BarnyShare/BarnyWarp%20Icon.svg" alt="Icon" style="height:28px;vertical-align:middle"></a></li>
            <li><a id="IconImage" href="https://arancia313.github.io/BarnyShare/devposts/13-11-25-extflashy"><img src="https://arancia313.github.io/BarnyShare/static/assets/media/extflashy.svg" alt="Extflashy" style="height:28px;vertical-align:middle"></a></li>
            <li><a id="darkModeToggle" href="#" aria-label="Toggle dark mode"><img src="https://arancia313.github.io/BarnyShare/static/assets/system/moon.png" alt="Moon Icon" style="height:20px;vertical-align:middle"></a></li>
            <li><a href="https://github.com/arancia313/BarnyShare" target="_blank" rel="noopener">GitHub</a></li>
            <li><a href="https://arancia313.github.io" target="_blank" rel="noopener">Arancia 3</a></li>
            <li><a href="https://arancia313.github.io/BarnyShare/editor">Editor</a></li>
            <li><a href="https://arancia313.github.io/BarnyShare/tools.html">Tools</a></li>
            <li><a href="https://arancia313.github.io/BarnyShare/devposts">Devposts</a></li>
            <li><a href="https://arancia313.github.io/BarnyShare/extensions">Extensions</a></li>
            <li><a href="https://arancia313.github.io/BarnyShare/sturdy.html">Sturdy</a></li>
            <li><input type="text" id="searchBar" placeholder="Search or Jump into..."></li>
        </ul>
    </footer>
  <script>
    (function(){
      const form = document.getElementById('signupForm');
      const msg = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = '';

        const displayName = document.getElementById('displayName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          msg.textContent = 'Inserisci email e password';
          msg.className = 'error';
          return;
        }
        if (password.length < 6) {
          msg.textContent = 'La password deve avere almeno 6 caratteri';
          msg.className = 'error';
          return;
        }

        try {
          const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, displayName })
          });
          const data = await res.json();
          if (!res.ok) {
            msg.textContent = data && data.error ? data.error : 'Errore durante la registrazione';
            msg.className = 'error';
            return;
          }

          msg.textContent = 'Registrazione avvenuta con successo. Puoi ora effettuare il login.';
          msg.className = 'success';
          form.reset();
        } catch (err) {
          msg.textContent = 'Impossibile contattare il server';
          msg.className = 'error';
          console.error(err);
        }
      });
    })();
  </script>
