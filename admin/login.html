<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login - BarnyShare</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6}
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:360px}
    h1{font-size:18px;margin-bottom:6px}
    label{display:block;margin-top:12px;font-size:13px;color:#333}
    input[type=password]{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ddd}
    button{margin-top:16px;width:100%;padding:10px;border-radius:6px;border:none;background:#667eea;color:#fff;font-weight:600;cursor:pointer}
    .error{color:#c53030;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <p>Enter admin passcode to manage uploads.</p>
    <label for="pass">Passcode</label>
    <input id="pass" type="password" autocomplete="off" />
    <button id="submit">Sign in</button>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
  </div>
  <script>
    const submit = document.getElementById('submit');
    const pass = document.getElementById('pass');
    const error = document.getElementById('error');
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/index.html';

    submit.addEventListener('click', async () => {
      error.textContent = '';
      const passcode = pass.value;
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        if (!res.ok) throw new Error('Invalid credentials');
        // success
        location.href = next;
      } catch (err) {
        error.textContent = 'Login failed — verifica la passcode.';
      }
    });

    pass.addEventListener('keyup', (e) => { if (e.key === 'Enter') submit.click(); });
  </script>
</body>
</html>
